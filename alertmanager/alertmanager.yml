route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      continue: true

receivers:
  - name: default
    # Replace with a real Slack/webhook/email receiver in use.
    webhook_configs:
      - url: "http://localhost:5001/"
        send_resolved: true
